<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공공 웹사이트 불법광고 탐지 도구</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F7F5; --panel:#FFFFFF; --line:#E2E2DD; --line2:#CECEC7;
  --ink:#1A1B1E; --dim:#5F6166; --faint:#8A8C91;
  --accent:#1B4D8F; --accent-soft:#EAF0F8;
  --danger:#B3261E; --danger-soft:#FBEBEA;
  --warn:#8A5A00; --warn-soft:#FDF3E2;
  --ok:#0B6B3A; --ok-soft:#E8F3EC;
}
body{font-family:"Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
  font-variant-numeric:tabular-nums;word-break:keep-all}
.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 72px}

header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:22px}
h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
header .sub{font-size:13px;color:var(--dim)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:18px 20px;margin-bottom:16px}
.card h2{font-size:14px;font-weight:700;margin-bottom:12px;letter-spacing:-.01em}

/* 입력 */
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=url]{flex:1;min-width:260px;font:inherit;font-size:14px;padding:10px 12px;
  border:1px solid var(--line2);border-radius:4px;background:#fff}
input[type=url]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
button{font:inherit;font-size:14px;font-weight:700;padding:10px 20px;border-radius:4px;
  border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
button:hover{opacity:.88}
button[disabled]{opacity:.4;cursor:not-allowed}
button.ghost{background:#fff;color:var(--ink)}
.hint{font-size:12px;color:var(--faint);margin-top:8px}

/* 진행 */
#progress{display:none}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:30%;background:var(--accent);
  animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
.pstat{display:flex;gap:22px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.pstat b{color:var(--ink);font-size:15px}

/* 요약 */
#summary{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:5px;padding:12px 14px;background:#FCFCFB}
.tile .n{font-size:24px;font-weight:700;letter-spacing:-.02em}
.tile .l{font-size:12px;color:var(--dim);margin-top:2px}
.tile.red .n{color:var(--danger)}

/* 도구 막대 */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12.5px;padding:5px 11px;border:1px solid var(--line2);border-radius:999px;
  background:#fff;cursor:pointer;color:var(--dim)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.spacer{flex:1}

/* 결과 */
#results{display:none}
.page{border:1px solid var(--line);border-radius:6px;background:var(--panel);margin-bottom:14px;
  overflow:hidden}
.page > summary{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;
  background:#FCFCFB;border-bottom:1px solid var(--line);list-style:none}
.page > summary::-webkit-details-marker{display:none}
.page > summary::before{content:"▸";color:var(--faint);font-size:12px}
.page[open] > summary::before{content:"▾"}
.page .purl{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1;min-width:0}
.count{font-size:12px;background:var(--danger-soft);color:var(--danger);
  padding:2px 9px;border-radius:999px;font-weight:700;white-space:nowrap}

.find{padding:14px 16px;border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:none}
.find.done{background:#FAFAF8}
.find.done .ev{opacity:.5}
.fhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.tech{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:3px;letter-spacing:.02em}
.t-HOMOGLYPH{background:var(--warn-soft);color:var(--warn)}
.t-JAMO{background:var(--accent-soft);color:var(--accent)}
.t-TRANSPARENT{background:var(--danger-soft);color:var(--danger)}
.t-OFFSCREEN{background:#F0E9F6;color:#5B3A86}
.fid{font-size:11.5px;color:var(--faint);font-family:ui-monospace,Consolas,monospace}

.ev{background:#FBFAF7;border-left:3px solid var(--line2);padding:9px 12px;margin-bottom:9px;
  font-size:13.5px;white-space:pre-wrap;word-break:break-all}
.norm{display:block;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line2);
  font-size:13px;color:var(--ok)}
.norm b{font-weight:700}

dl.meta{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:12.5px;
  margin-bottom:10px}
dl.meta dt{color:var(--faint)}
dl.meta dd{color:var(--dim);word-break:break-all}
dl.meta dd.sel{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--ink)}

.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{font-size:12px;font-weight:500;padding:5px 11px;background:#fff;color:var(--dim);
  border-color:var(--line2)}
.acts button:hover{border-color:var(--ink);color:var(--ink)}
.acts button.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}

.empty{padding:40px 20px;text-align:center;color:var(--faint);font-size:14px}
footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;
  flex-wrap:wrap}
.err{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);
  padding:10px 14px;border-radius:4px;font-size:13.5px;margin-top:12px}
@media print{
  body{background:#fff}
  .tools,.acts,form,footer button{display:none}
  .page{break-inside:avoid;border-color:#999}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>공공 웹사이트 불법광고 탐지 도구</h1>
  <span class="sub">게시·은닉된 불법광고를 찾아 유형과 위치를 알려드립니다</span>
</header>

<form class="card" id="form">
  <h2>점검할 웹사이트</h2>
  <div class="row">
    <input type="url" id="url" placeholder="https://www.example.go.kr/board/list" required>
    <button type="submit" id="go">탐지 시작</button>
  </div>
  <p class="hint">입력한 주소에서 시작해 같은 사이트의 하위 페이지, 게시글, 댓글,
    iframe 내부까지 훑습니다. 결과는 구동 파일과 같은 폴더에 result.json 으로도 저장됩니다.</p>
  <div id="err" class="err" hidden></div>
</form>

<section class="card" id="progress">
  <h2>탐지 중</h2>
  <div class="bar"><i></i></div>
  <div class="pstat">
    <span>살펴본 페이지 <b id="p-pages">0</b></span>
    <span>찾은 항목 <b id="p-found">0</b></span>
    <span>경과 <b id="p-time">0</b>초</span>
  </div>
  <p class="hint" id="p-now"></p>
</section>

<section class="card" id="summary">
  <h2>요약</h2>
  <div class="tiles" id="tiles"></div>
  <p class="hint" id="s-note"></p>
</section>

<section id="results">
  <div class="tools">
    <button class="chip" data-f="all" aria-pressed="true">전체</button>
    <button class="chip" data-f="todo" aria-pressed="false">미처리만</button>
    <button class="chip" data-f="HOMOGLYPH" aria-pressed="false">닮은꼴</button>
    <button class="chip" data-f="JAMO" aria-pressed="false">자모 분해</button>
    <button class="chip" data-f="TRANSPARENT" aria-pressed="false">투명</button>
    <button class="chip" data-f="OFFSCREEN" aria-pressed="false">화면 밖</button>
    <span class="spacer"></span>
    <button class="ghost" id="csv">조치 목록 내려받기</button>
    <button class="ghost" id="print">인쇄</button>
  </div>
  <div id="list"></div>
</section>

<footer>
  <span>탐지 결과는 참고 자료입니다. 삭제 여부는 담당자가 확인 후 판단해 주세요.</span>
  <span id="ver"></span>
</footer>

</div>
<script src="app.js"></script>
</body>
</html>
