<title>올리기까지 남은 일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
:root{
  --paper:#FBFAF6; --ground:#E3E3DC; --sunk:#F1F0EA;
  --ink:#16171A; --ink-2:#44464B; --muted:#6C6F75;
  --rule:#CBCAC1; --hair:#DEDDD5; --heavy:#16171A;
  --seal:#A8242B; --done:#0B7A4B;
  --sans:"Gothic A1",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --myeongjo:"Nanum Myeongjo","Batang",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15161A; --ground:#0C0D10; --sunk:#1B1D22;
  --ink:#E9E8E2; --ink-2:#B8B7B1; --muted:#8A8C91;
  --rule:#32343A; --hair:#26282D; --heavy:#E9E8E2;
  --seal:#DB6B70; --done:#1FA97F;}}
:root[data-theme="dark"]{
  --paper:#15161A; --ground:#0C0D10; --sunk:#1B1D22;
  --ink:#E9E8E2; --ink-2:#B8B7B1; --muted:#8A8C91;
  --rule:#32343A; --hair:#26282D; --heavy:#E9E8E2;
  --seal:#DB6B70; --done:#1FA97F;}

*{box-sizing:border-box;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15.5px;line-height:1.75;-webkit-font-smoothing:antialiased}
.sheet{max-width:720px;margin:0 auto;background:var(--paper);
  border-left:1px solid var(--hair);border-right:1px solid var(--hair);
  padding-inline:clamp(16px,4.4vw,38px);padding-block:0 64px}

.head{padding-block:28px 0}
.head .org{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--ink-2)}
.head .rule{border-bottom:2.5px solid var(--heavy);margin-top:10px}
.head .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule);padding:7px 0 8px;font-size:12.5px;color:var(--muted)}
h1{font-family:var(--myeongjo);font-weight:800;font-size:clamp(23px,5.2vw,31px);
  line-height:1.4;letter-spacing:-.02em;margin-top:26px;word-break:keep-all}
.intro{color:var(--ink-2);margin-top:12px;max-width:58ch;word-break:keep-all}

/* 진행률 */
.meter{margin-top:22px;border-top:2.5px solid var(--heavy);
  border-bottom:1px solid var(--rule);padding:13px 0 12px}
.meter .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.meter .top b{font-family:var(--myeongjo);font-weight:800;font-size:23px;letter-spacing:-.02em}
.meter .top span{font-size:12.5px;color:var(--muted)}
.bar{height:7px;background:var(--sunk);margin-top:10px;border:1px solid var(--hair)}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .25s}
.sync{font-size:11.5px;color:var(--muted);margin-top:8px}

/* 묶음 */
.grp{margin-top:34px}
.grp>.hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  border-bottom:2.5px solid var(--heavy);padding-bottom:9px}
.grp>.hd .no{font-family:var(--myeongjo);font-weight:800;font-size:19px;color:var(--seal);flex:none}
.grp>.hd h2{font-family:var(--myeongjo);font-weight:700;font-size:19px;letter-spacing:-.015em;
  word-break:keep-all}
.grp>.hd .tag{margin-left:auto;font-size:11.5px;font-weight:700;letter-spacing:.02em;
  border:1px solid var(--rule);padding:2px 8px;color:var(--muted);white-space:nowrap}
.grp>.hd .tag.pc{border-color:var(--seal);color:var(--seal)}
.grp>.note{font-size:13.5px;color:var(--muted);padding:11px 2px 3px;word-break:keep-all}

/* 항목 */
.it{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;
  border-bottom:1px solid var(--hair);cursor:pointer}
.it:hover{background:var(--sunk)}
.it .bx{flex:none;width:19px;height:19px;border:1.5px solid var(--rule);background:var(--paper);
  margin-top:4px;display:grid;place-items:center}
.it .bx::after{content:"";width:9px;height:5px;border-left:2px solid var(--paper);
  border-bottom:2px solid var(--paper);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.it.on .bx{background:var(--done);border-color:var(--done)}
.it.on .bx::after{opacity:1}
.it .tx{flex:1;min-width:0;word-break:keep-all}
.it .tx b{font-weight:500;display:block}
.it .tx small{display:block;font-size:13px;color:var(--muted);line-height:1.6;margin-top:1px}
.it.on .tx b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.it:focus-visible{outline:2px solid var(--seal);outline-offset:-2px}
.it a{color:var(--seal);font-weight:500}

.callout{background:var(--sunk);border-top:1.5px solid var(--seal);
  border-bottom:1px solid var(--rule);padding:15px 16px;margin-top:16px;
  font-size:14px;color:var(--ink-2);word-break:keep-all}
.callout b{color:var(--ink)}
footer{border-top:2.5px solid var(--heavy);padding-top:18px;margin-top:40px;
  font-size:12.5px;color:var(--muted);line-height:1.8;word-break:keep-all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="sheet">
  <div class="head">
    <div class="org">정산 엑스레이</div>
    <div class="rule"></div>
    <div class="meta"><span>출시 준비 점검표</span><span id="today"></span></div>
  </div>

  <h1>올리기까지 남은 일</h1>
  <p class="intro">만드는 건 끝났습니다. 아래는 전부 님이 하셔야 하는 일이고,
    <b>3번 묶음만 PC가 한 번 필요</b>합니다. 체크는 저장되니 며칠에 걸쳐 하셔도 됩니다.</p>

  <div class="meter">
    <div class="top"><b id="cnt">0 / 0</b><span id="left"></span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="sync" id="sync">불러오는 중…</div>
  </div>

  <div id="list"></div>

  <div class="callout">
    <b>손절 기준을 지금 정해두세요.</b> 라이트판을 처음 뿌린 날짜를 적어두고,
    90일 뒤에 판매가 10건 미만이면 접습니다. 나중에는 못 정합니다.
  </div>

  <footer>
    붙여넣을 문구는 문구 덱에, 파일과 이미지는 대화에 있습니다.<br>
    막히면 화면을 캡처해서 물어보세요. 특히 크몽 등록 화면에서 막히면 그게 제일 유용합니다.
  </footer>
</div>

<script>
const GROUPS = [
  {no:"0", title:"링크 살리기", tag:"모바일 · 5분", note:"지금은 전부 비공개라 본인만 열립니다. 각 페이지 우측 상단 Share 메뉴에서 바꿉니다.", items:[
    {id:"share-lite", t:"라이트판을 공개로 바꾸기",
     d:'<a href="https://claude.ai/artifact/BA2SCuYfrjucy7veU2qMHh" target="_blank" rel="noopener">라이트판 열기</a> → Share → 링크 있는 사람 모두'},
    {id:"share-land", t:"랜딩페이지를 공개로 바꾸기",
     d:'<a href="https://claude.ai/artifact/VbpN25f9Cpw3nUXdTYAM9H" target="_blank" rel="noopener">랜딩페이지 열기</a> → Share → 링크 있는 사람 모두'},
    {id:"share-check", t:"랜딩의 버튼이 라이트판으로 열리는지 확인",
     d:"둘 다 공개해야 링크가 삽니다. 시크릿 창으로 열어보면 확실합니다"},
  ]},
  {no:"1", title:"크몽 전문가 등록", tag:"모바일 · 15분", note:"사업자등록증은 필요 없습니다. 개인으로 등록하면 별도 승인 없이 끝납니다.", items:[
    {id:"km-app", t:"크몽 앱 설치하고 가입"},
    {id:"km-expert", t:"전문가로 전환", d:"마이크로몽에서 전문가 전환을 누릅니다"},
    {id:"km-auth", t:"휴대폰 본인인증"},
    {id:"km-bank", t:"본인 명의 계좌 입력", d:"실명과 예금주가 같아야 바로 인증이 끝납니다"},
    {id:"km-profile", t:"프로필 채우기", d:"프로필은 앱에서도 됩니다. 서비스 등록만 PC가 필요합니다"},
  ]},
  {no:"2", title:"등록 화면에 들어가지는지 보기", tag:"모바일 · 5분", note:"크몽은 서비스 등록을 PC 웹에서만 지원한다고 안내합니다. 다만 데스크톱 모드로 되는 경우가 있으니 공짜로 먼저 시도해봅니다.", items:[
    {id:"desk-mode", t:"크롬·사파리에서 '데스크톱 사이트 요청' 켜고 kmong.com 접속"},
    {id:"desk-try", t:"마이크로몽 → 내 서비스 → 등록까지 들어가지는지 확인"},
    {id:"desk-plan", t:"안 되면 PC 1시간 확보 계획 세우기", d:"PC방·회사·도서관·지인. 한 번만 쓰면 됩니다"},
  ]},
  {no:"3", title:"크몽 서비스 등록", tag:"PC 1회 · 40분", pc:true, note:"여기만 PC가 필요합니다. 붙여넣을 문구는 문구 덱 크몽 탭에 복사 버튼과 함께 있습니다.", items:[
    {id:"reg-cat", t:"카테고리: 노하우·콘텐츠 → 자료·템플릿",
     d:"업무자동화가 아닙니다. 자동발송이 되는 쪽이어야 합니다"},
    {id:"reg-title", t:"서비스 제목 붙여넣기"},
    {id:"reg-price", t:"가격 49,000원 단일 상품으로 설정", d:"패키지를 3단으로 쪼개지 않습니다"},
    {id:"reg-desc", t:"서비스 설명 붙여넣기"},
    {id:"reg-faq", t:"FAQ 붙여넣기"},
    {id:"reg-img", t:"미리보기 이미지 01~05 업로드", d:"최소 5장, 본문 4장 이상이 조건입니다"},
    {id:"reg-file", t:"정산엑스레이_v1.zip 업로드", d:"HTML 단독이 아니라 ZIP으로 올립니다"},
    {id:"reg-msg", t:"결제 후 안내 메시지 붙여넣기"},
    {id:"reg-submit", t:"제출", d:"심사는 영업일 7일 이내입니다"},
  ]},
  {no:"4", title:"라이트판 뿌리기", tag:"모바일 · 계속", note:"앞의 셋은 판매대를 차리는 일이고 이건 사람을 데려오는 일입니다. 이걸 안 하면 등록만 해두고 아무 일도 일어나지 않습니다.", items:[
    {id:"dist-cafe", t:"스마트스토어·셀러 카페 2~3곳 가입"},
    {id:"dist-rule", t:"각 카페의 홍보 규칙 확인", d:"규칙을 어기면 강퇴당하고 다시 못 들어갑니다. 먼저 읽습니다"},
    {id:"dist-post", t:"라이트판 링크와 짧은 글 올리기",
     d:'"무료 도구입니다"가 아니라 "내 정산서에 적자 상품 있는지 확인해보세요"로 씁니다'},
    {id:"dist-chat", t:"셀러 오픈채팅방에 공유"},
    {id:"dist-blog", t:"블로그 글 1개 쓰기", d:"내 정산서에서 적자 상품 찾아본 이야기"},
    {id:"dist-date", t:"처음 뿌린 날짜 적어두기", d:"손절 기준 90일의 시작일입니다"},
  ]},
  {no:"5", title:"확인해둘 것", tag:"모바일 · 선택", note:"지금 당장 막는 건 아니지만, 알고 시작하는 편이 낫습니다.", items:[
    {id:"biz-report", t:"통신판매업 신고 대상인지 확인",
     d:"디지털 콘텐츠도 대상입니다. 거래 횟수·규모 기준을 넘으면 신고 후 판매해야 합니다. 정부24에서 확인"},
    {id:"biz-tax", t:"세금 처리 방법 알아보기", d:"매출이 생기기 시작하면 세무사 상담이 정확합니다"},
  ]},
  {no:"6", title:"Gumroad", tag:"모바일 · 나중에", note:"한국 셀러 유입이 없어 결제 파이프 역할만 합니다. 크몽이 자리잡은 뒤에 해도 늦지 않습니다.", items:[
    {id:"gum-signup", t:"gumroad.com 가입"},
    {id:"gum-payout", t:"정산 설정", d:"신분증과 거주 증명이 필요합니다. 한국 계좌로 원화 입금됩니다"},
    {id:"gum-product", t:"상품 등록", d:"문구 덱 Gumroad 탭 + 커버 06·07 + 정산엑스레이_v1.zip"},
  ]},
];

const ALL = GROUPS.flatMap(g => g.items.map(i => i.id));
let checked = {};
let db = null, writeTimer = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function readLocal(){
  try { return JSON.parse(localStorage.getItem("xray.checklist") || "{}"); } catch { return {}; }
}
function writeLocal(){
  try { localStorage.setItem("xray.checklist", JSON.stringify(checked)); } catch {}
}

function build(){
  const box = document.getElementById("list");
  box.innerHTML = GROUPS.map(g => `
    <section class="grp">
      <div class="hd"><span class="no">${g.no}</span><h2>${esc(g.title)}</h2>
        <span class="tag${g.pc ? " pc" : ""}">${esc(g.tag)}</span></div>
      ${g.note ? `<p class="note">${esc(g.note)}</p>` : ""}
      ${g.items.map(i => `
        <div class="it" data-id="${i.id}" role="checkbox" aria-checked="false" tabindex="0">
          <span class="bx" aria-hidden="true"></span>
          <span class="tx"><b>${esc(i.t)}</b>${i.d ? `<small>${i.d}</small>` : ""}</span>
        </div>`).join("")}
    </section>`).join("");

  box.querySelectorAll(".it").forEach(el => {
    const toggle = () => flip(el.dataset.id);
    el.addEventListener("click", e => { if (e.target.tagName !== "A") toggle(); });
    el.addEventListener("keydown", e => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); }
    });
  });
}

function paint(){
  document.querySelectorAll(".it").forEach(el => {
    const on = !!checked[el.dataset.id];
    el.classList.toggle("on", on);
    el.setAttribute("aria-checked", on ? "true" : "false");
  });
  const n = ALL.filter(id => checked[id]).length;
  document.getElementById("cnt").textContent = `${n} / ${ALL.length}`;
  document.getElementById("fill").style.width = (n / ALL.length * 100) + "%";
  const left = ALL.length - n;
  document.getElementById("left").textContent =
    left === 0 ? "전부 끝났습니다" : `${left}개 남음`;
}

function flip(id){
  checked[id] = !checked[id];
  if (!checked[id]) delete checked[id];
  paint();
  writeLocal();
  save();
}

/* 서버 저장 — 연타는 한 번으로 모읍니다 */
function save(){
  if (!db) return;
  clearTimeout(writeTimer);
  writeTimer = setTimeout(async () => {
    try {
      await db.doc("checklist/progress").set({ checked, updatedAt: new Date().toISOString() });
      note("저장됨 · 다른 기기에서도 이어집니다");
    } catch (e) {
      note(e && e.code === "invalid_argument"
        ? "이 기기에만 저장됩니다 (쓰기 권한 없음)"
        : "저장에 실패했습니다. 이 기기에는 남아 있습니다");
    }
  }, 500);
}
const note = t => { document.getElementById("sync").textContent = t; };

/* 먼저 그리고, 서버는 준비되면 붙습니다 */
checked = readLocal();
build();
paint();
document.getElementById("today").textContent =
  new Date().toLocaleDateString("ko-KR", {year:"numeric", month:"long", day:"numeric"});
note("이 기기에 저장 중");

(async () => {
  try {
    db = (window.claude && claude.use) ? await claude.use("db") : null;
  } catch { db = null; }
  if (!db) { note("이 기기에만 저장됩니다"); return; }
  db.doc("checklist/progress").onSnapshot(
    snap => {
      const d = snap.exists ? snap.data() : null;
      if (d && d.checked && typeof d.checked === "object") {
        checked = Object.assign({}, d.checked);
        writeLocal();
        paint();
      }
      note("저장됨 · 다른 기기에서도 이어집니다");
    },
    () => note("이 기기에만 저장됩니다")
  );
})();
</script>
